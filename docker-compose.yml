services:
  nodemon:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["nodemon-data:/data"]
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
volumes:
  nodemon-data:
