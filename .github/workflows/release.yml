name: Release

# Pushing a tag such as v0.1.0 builds the connector for every supported computer type and publishes
# one ZIP per type (plus SHA256SUMS) as a GitHub Release. The text of the release is the CHANGELOG.md section of that version. The dashboard's "add computer" window links to these.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create for this release, e.g. v0.1.0 (it points at the commit the workflow runs on)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the version and prepare the release notes
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Version must look like v1.2.3, got $TAG" >&2; exit 1;; esac
          # The notes are the CHANGELOG.md section of this version; this fails if the section is missing.
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          # Stamp the program with the tag (nodemon-connector --version), also when started by hand.
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG"
      - name: Tests
        working-directory: connector
        run: go test ./...
      - name: Build every computer type
        run: node scripts/build-connector.mjs --out "$RUNNER_TEMP/dist"
      - name: Pack one ZIP per computer type
        run: node scripts/package-release.mjs --in "$RUNNER_TEMP/dist" --out "$RUNNER_TEMP/release"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/release/* \
            --target "$GITHUB_SHA" \
            --title "NodeMon $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
